[project]
name = "anotherme-monorepo"
version = "0.1.0"
description = "AnotherMe AI Avatar Platform"
readme = "README.md"

# 統一Ruff設定
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments
    "T201",   # print statements
]
ignore = [
    "B008",  # function call in default argument
    "W191",  # indentation contains tabs
    "B904",  # raise without from e
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
exclude = ["venv", ".venv", "build", "dist", "__pycache__"]

# サードパーティライブラリの型無視
[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "torchvision",
    "torchvision.*",
    "torchaudio",
    "torchaudio.*",
    "transformers",
    "transformers.*",
    "qwen_tts",
    "qwen_tts.*",
    "accelerate",
    "accelerate.*",
]
ignore_missing_imports = true
follow_untyped_imports = false
