name: Test TTS Server

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "tts-server/**/*.py"
      - "tts-server/pyproject.toml"
      - "tts-server/uv.lock"
      - "pyproject.toml"
      - "scripts/test-all.sh"
      - ".github/workflows/test-tts-server.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "tts-server/**/*.py"
      - "tts-server/pyproject.toml"
      - "tts-server/uv.lock"
      - "pyproject.toml"
      - "scripts/test-all.sh"
      - ".github/workflows/test-tts-server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        working-directory: tts-server
        run: uv python install

      - name: Install dependencies
        working-directory: tts-server
        run: uv sync --extra cpu --group dev

      - name: Run tests
        working-directory: tts-server
        run: uv run pytest tests/ -v --tb=short --cov --cov-report=term-missing --cov-report=html

      - name: Store coverage files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: tts-server/htmlcov
          include-hidden-files: true

      - name: Coverage report
        working-directory: tts-server
        run: uv run coverage report

      - name: Extract coverage percentage
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        id: coverage
        working-directory: tts-server
        run: |
          COVERAGE=$(uv run coverage report --format=total)
          echo "total=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${COVERAGE}%"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ac2cfc2237210a437cb17a73d5d4c2a3
          filename: tts-server-coverage.json
          label: "coverage: tts-server"
          message: "${{ steps.coverage.outputs.total }}%"
          valColorRange: ${{ steps.coverage.outputs.total }}
          minColorRange: 0
          maxColorRange: 100
