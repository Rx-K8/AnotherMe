name: Lint TTS Server

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "tts-server/**/*.py"
      - "tts-server/pyproject.toml"
      - "tts-server/uv.lock"
      - "pyproject.toml"
      - "scripts/lint-all.sh"
      - ".pre-commit-config.yaml"
      - ".github/workflows/lint-tts-server.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "tts-server/**/*.py"
      - "tts-server/pyproject.toml"
      - "tts-server/uv.lock"
      - "pyproject.toml"
      - "scripts/lint-all.sh"
      - ".pre-commit-config.yaml"
      - ".github/workflows/lint-tts-server.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        working-directory: tts-server
        run: uv python install

      - name: Install dependencies
        working-directory: tts-server
        run: uv sync --group dev --index pytorch-cu124=https://download.pytorch.org/whl/cpu

      - name: Run lint
        working-directory: tts-server
        env:
          SERVER_HOST: "0.0.0.0"
          SERVER_PORT: "8001"
          CORS_ORIGINS: '["*"]'
        run: uv run ./scripts/lint.sh
