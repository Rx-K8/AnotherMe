name: Lint Frontend

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "frontend/**"
      - "scripts/lint-all.sh"
      - ".github/workflows/lint-frontend.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "frontend/**"
      - "scripts/lint-all.sh"
      - ".github/workflows/lint-frontend.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint
