[project]
name = "AnotherMe-ChatServer"
version = "0.1.0"
description = "AnotherMeのチャットサーバー"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "fastapi[standard]>=0.123.0",
    "pre-commit>=4.4.0",
    "pydantic-settings>=2.12.0",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "transformers>=4.57.3",
]

[dependency-groups]
dev = [
    "mypy==1.19.0",
    "ruff==0.14.8",
]

# Lint設定はルートのpyproject.tomlで統一管理

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
