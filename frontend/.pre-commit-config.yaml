repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json
        exclude: ^tsconfig.*\.json$
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: npm run check
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
        pass_filenames: false
