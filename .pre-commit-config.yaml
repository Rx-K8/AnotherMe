repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: check-json
        exclude: ^(frontend/)?tsconfig.*\.json$
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Python: 統一Ruff設定（chat-server, tts-server, lipsync-server）
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args:
          - --fix
        files: ^(chat-server|tts-server|lipsync-server)/.*\.py$
      - id: ruff-format
        files: ^(chat-server|tts-server|lipsync-server)/.*\.py$

  # TypeScript: Frontend
  - repo: local
    hooks:
      - id: biome-check
        name: biome check frontend
        entry: bash -c 'cd frontend && npm run check'
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
        files: ^frontend/
        pass_filenames: false
