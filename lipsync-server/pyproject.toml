[project]
name = "anotherme-lipsync-server"
version = "0.1.0"
description = "AnotherMe Lipsync Server with MuseTalk"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    # --- MuseTalk dependencies (検証済み) ---
    # MuseTalk本体はsys.pathで参照 (submodules/MuseTalk)
    "accelerate==0.28.0",
    "diffusers==0.30.2",
    "einops==0.8.1",
    "ffmpeg-python>=0.2.0",
    "gdown>=5.2.1",
    "huggingface-hub==0.30.2",
    "imageio[ffmpeg]>=2.37.2",
    "json-tricks>=3.17.3",
    "librosa==0.11.0",
    "moviepy>=1.0.3",
    "munkres>=1.1.4",
    "numpy==1.23.5",
    "omegaconf>=2.3.0",
    "opencv-python==4.9.0.80",
    "openmim>=0.3.9",
    "requests>=2.32.5",
    "soundfile==0.12.1",
    "tensorboard==2.12.0",
    "tensorflow==2.12.0",
    "torch==2.0.1",
    "torchaudio==2.0.2",
    "torchvision==0.15.2",
    "transformers==4.39.2",
    "xtcocotools>=1.14.3",
    # setuptools<70: mmpose/mmengine が pkg_resources を使用するが
    # setuptools v82+ で削除されたため、pkg_resources を含むバージョンを固定
    "setuptools<70",
    # --- Server dependencies ---
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy==1.19.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff==0.14.8",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: 単体テスト (CPU, 高速)",
    "integration: 統合テスト (CPU, Mock使用)",
    "gpu: GPU依存テスト (CI除外)",
]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"
omit = [
    "app/main.py",
    "app/lipsync/musetalk_provider.py",
]

[tool.coverage.html]
show_contexts = true
