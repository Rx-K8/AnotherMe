[project]
name = "anotherme-tts-server"
version = "0.1.0"
description = "AnotherMe TTS Server with Qwen3-TTS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qwen-tts",
    "fastapi==0.115.6",
    "pydantic==2.7.0",
    "uvicorn==0.30.0",
    "soundfile==0.12.1",
    "pydantic-settings>=2.12.0",
    "torch",
    "torchaudio",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy==1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff==0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# プロジェクト固有の例外
[tool.ruff.lint.per-file-ignores]
"app/api/routes/demo.py" = ["E501"]  # HTMLテンプレートの行長を許容

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"
omit = ["app/main.py"]  # GPU依存のエントリポイント

[tool.coverage.html]
show_contexts = true
