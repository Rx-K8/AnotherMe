[project]
name = "anotherme-tts-server"
version = "0.1.0"
description = "AnotherMe TTS Server with Qwen3-TTS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qwen-tts",
    "fastapi==0.115.6",
    "pydantic==2.7.0",
    "uvicorn==0.30.0",
    "torchaudio",
    "soundfile==0.12.1",
    "torch",
    "pydantic-settings>=2.12.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy==1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff==0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "third_party"]

[[tool.mypy.overrides]]
module = [
    "torchaudio",
    "torchaudio.*",
    "qwen_tts",
    "qwen_tts.*",
]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.ruff]
target-version = "py312"
line-length = 88  # Blackのデフォルトと同じ

[tool.ruff.lint]
select = [
    "E",      # pycodestyleエラー
    "W",      # pycodestyle警告
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # 関数内の未使用引数
    "T201",   # print文を許可しない
]
ignore = [
    "B008",  # 引数のデフォルト値で関数呼び出しを行わない
    "W191",  # インデントにタブが含まれる
    "B904",  # from eなしで例外を発生させることを許可(HTTPException用)
]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/demo.py" = ["E501"]  # HTMLテンプレートの行長を許容

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"
omit = ["app/main.py"]  # GPU依存のエントリポイント

[tool.coverage.html]
show_contexts = true
